contentOrigin:
  repofiles:
    - ./rpms.repo
context:
  bare: true

#
# To update rpms.lock.yaml:
#    rpm-lockfile-prototype rpms.in.yaml
#

arches:
  - x86_64
  - aarch64

packages:
  - cargo
  - freetype
  - freetype-devel
  - gcc
  - gcc-c++
  - gettext
  - git-core
  - httpd
  - libffi-devel
  - libjpeg-turbo
  - libjpeg-turbo-devel
  - libtiff
  - libtiff-devel
  - libwebp
  - libwebp-devel
  - libxml2-devel
  - libxslt-devel
  - mod_ssl
  - openssl
  - openssl-devel
  - python3
  - python3-cryptography-43.0.0-4.el10
  - python3-devel
  - python3-mod_wsgi
  - python3-pip
  - python3-setuptools
  - python3-wheel
  - rust
  - tar
  - zlib-devel
