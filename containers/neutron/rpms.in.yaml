  - dnsmasq-utils
  - frr
  - gcc
  - gcc-c++
  - git-core
  - haproxy
  - httpd
  - iproute
  - ipset
  - iptables
  - keepalived
  - libffi-devel
  - libseccomp
  - libxml2-devel
  - libxslt-devel
  - mod_ssl
  - openssl-devel
  - openvswitch
  - podman
  - python3
  - python3-cryptography-43.0.0-4.el10
  - python3-devel
  - python3-mod_wsgi
  - python3-openvswitch
  - python3-pip
  - python3-setuptools
  - python3-unbound
  - radvd
  - rust
