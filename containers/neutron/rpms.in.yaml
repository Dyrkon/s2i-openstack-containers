contentOrigin:
  repofiles:
    - ./rpms.repo
context:
  bare: true

#
# To update rpms.lock.yaml:
#    rpm-lockfile-prototype rpms.in.yaml
#

arches:
  - x86_64
  - aarch64

packages:
  - cargo
  - conntrack-tools
  - dibbler-client
