contentOrigin:
  repofiles:
    - ./rpms.repo
context:
  bare: true

#
# To update rpms.lock.yaml:
#    rpm-lockfile-prototype rpms.in.yaml
#

arches:
  - x86_64
  - aarch64

packages:
  - attr
  - cargo
  - gcc
  - gcc-c++
  - git-core
  - httpd
  - libattr-devel
  - liberasurecode
  - liberasurecode-devel
  - libffi
  - libffi-devel
  - libxml2
  - libxml2-devel
  - libxslt
  - libxslt-devel
  - mod_ssl
  - nmap-ncat
  - openssl-devel
  - python3
  - python3-cryptography-43.0.0-4.el10
  - python3-devel
  - python3-pip
  - python3-setuptools
  - python3-wheel
  - rsync
  - rust
