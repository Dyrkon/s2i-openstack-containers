  - aarch64

packages:
  - cargo
  - gcc
  - gcc-c++
  - git-core
  - httpd
  - liberasurecode
  - liberasurecode-devel
  - libffi-devel
  - libxml2-devel
  - libxslt-devel
  - mod_ssl
  - nmap-ncat
  - openssl-devel
  - python3
  - python3-cryptography
  - python3-devel
  - python3-pip
  - python3-setuptools
  - python3-wheel
  - rsync
  - rust
