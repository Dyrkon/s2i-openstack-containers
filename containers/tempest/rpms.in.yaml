arches:
  - x86_64
  - aarch64

packages:
  - cargo
  - gcc
  - gcc-c++
  - git-core
  - iputils
  - libffi-devel
  - openssl-devel
  - python3
  - python3-devel
  - python3-pip
  - python3-setuptools
  - python3-subunit
  - qemu-img
  - rust
  - subunit-filters
  - tar
