name: Tests (source reproducibility)

on:
  pull_request:
    paths:
      - .github/actions/setup-tox/action.yml
      - .github/workflows/test-update-sources.yml
      - build.sh
      - containers/**/*deps.txt
      - containers/**/excluded-requirements.txt
      - containers/**/sources.txt
      - tox.ini
  push:
    paths:
      - .github/actions/setup-tox/action.yml
      - .github/workflows/test-update-sources.yml
      - build.sh
      - containers/**/*deps.txt
      - containers/**/excluded-requirements.txt
      - containers/**/sources.txt
      - tox.ini
  workflow_dispatch:

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-tox

      - uses: ./.github/actions/detect-changed-services
        id: changes

      - name: Regenerate from committed source pins (changed services only)
        env:
          UPDATE_LOCKFILES_TARGETS: ${{ steps.changes.outputs.services }}
        run: |
          if [ -n "${UPDATE_LOCKFILES_TARGETS}" ]; then
            tox -e update-lockfiles -- ${UPDATE_LOCKFILES_TARGETS}
          else
            echo "No change detected in containerfiles"
          fi

      - name: Require reproducible generated files
        run: |
          changed=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard containers/)
          if [[ -n "${changed}" || -n "${untracked}" ]]; then
            echo "ERROR: Lockfiles are out of date."
            echo "Run 'tox -e update-lockfiles' locally and commit the result."
            echo ""
            [[ -n "${changed}" ]] && echo "Modified files:" && echo "${changed}"
            [[ -n "${untracked}" ]] && echo "New files:" && echo "${untracked}"
            exit 1
          fi
