name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - build.sh
      - tox.ini
      - containers/**
      - '!**/OWNERS'
      - '!**/OWNERS_ALIASES'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/detect-changed-services
        id: changes

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      REGISTRY: quay.io
      NAMESPACE: ${{ secrets.IMAGENAMESPACE }}
      IMAGE_PREFIX: openstack
      TAG: "master-${{ github.sha }},master-latest"
      TAG_EXPIRATION_WEEKS: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-tox

      - name: Cache container storage
        uses: actions/cache@v3
        with:
          path: ~/.local/share/containers/storage
          key: containers-${{ hashFiles('containers/**/sources.txt', 'containers/**/Containerfile') }}
          restore-keys: |
            containers-${{ hashFiles('containers/**/sources.txt') }}-
            containers-

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('containers/**/requirements.lock.*') }}
          restore-keys: |
            pip-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y buildah podman

      - name: Build images
        run: |
          if [ -n "${{ needs.detect-changes.outputs.services }}" ]; then
            echo "Building changed services: base ${{ needs.detect-changes.outputs.services }}"
            tox -e build -- base ${{ needs.detect-changes.outputs.services }}
          else
            echo "No service changes, building all (initial run or non-container changes)"
            tox -e build
          fi

      - name: list images
        id: built-images
        run: |
          podman images
          repositories="$(
            podman images --format '${{ '{{.Repository}}' }}' |
              grep "^${REGISTRY}/${NAMESPACE}/${IMAGE_PREFIX}-" |
              sort -u |
              tr '\n' ' '
          )"
          echo "repos=${repositories}" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ env.REGISTRY }}
          username: '$oauthtoken'
          password: ${{ secrets.QUAY_OAUTH_TOKEN }}
          auth_file_path: ${{ runner.temp }}/auth.json

      - name: Ensure Quay repositories exist and are public
        run: |
          for FULL_REPO in ${{ steps.built-images.outputs.repos }}; do
            REPO_NAME="${FULL_REPO##*/}"
            echo "Ensuring repository ${NAMESPACE}/${REPO_NAME} exists..."

            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${{ env.REGISTRY }}/api/v1/repository" \
              -H "Authorization: Bearer ${{ secrets.QUAY_OAUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "repository": "'"${REPO_NAME}"'",
                "namespace": "'"${NAMESPACE}"'",
                "description": "Created automatically via CI",
                "visibility": "public"
              }')
            if [ "$RESPONSE_CODE" -eq 201 ]; then
              echo "Repository created successfully."
            elif [ "$RESPONSE_CODE" -eq 400 ]; then
              echo "Repository already exists, proceeding."
            else
              echo "Failed to create repository. API returned HTTP $RESPONSE_CODE"
              exit 1
            fi
          done

      - name: Push images
        run: tox -e custom -- push all
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json

      - name: Expire commit-sha tags
        # Set a Quay tag expiration on the master-<sha> tag only, via the
        # tag update API. This is a per-tag pointer, not an image label, so
        # it never touches master-latest (or any other tag later applied to
        # the same image) and has no effect on downstream container builds,
        # which don't run this workflow.
        run: |
          set -x
          EXP_TIME=$(($(date +%s) + TAG_EXPIRATION_WEEKS * 604800))
          for FULL_REPO in ${{ steps.built-images.outputs.repos }}; do
            REPO_NAME="${FULL_REPO##*/}"
            REPO_URL="https://${{ env.REGISTRY }}/api/v1/repository/${NAMESPACE}/${REPO_NAME}"
            TAG_NAME="master-${{ github.sha }}"
            echo "Setting expiration on ${NAMESPACE}/${REPO_NAME}:${TAG_NAME}"

            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${{ secrets.QUAY_OAUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"expiration\": ${EXP_TIME}}" \
              "${REPO_URL}/tag/${TAG_NAME}")

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "Failed to set expiration, HTTP ${HTTP_STATUS}: $(cat response.json)"
              exit 1
            fi
            echo "Response: $(cat response.json)"

            EXPIRATION=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.QUAY_OAUTH_TOKEN }}" \
              "${REPO_URL}/tag/?specificTag=${TAG_NAME}&onlyActiveTags=true" \
              | jq -r '.tags[0].expiration // "none"')
            echo "Confirmed expiration for ${REPO_NAME}:${TAG_NAME}: ${EXPIRATION}"
          done
